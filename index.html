    <meta charset="UTF-8" />

    <meta name="description" content="Aplikasi Progressive Web App (PWA) layanan jasa titip belanja, titip beli makanan dan oleh-oleh, serta pengantaran barang kilat kurir di Singkawang, Kalimantan Barat." />
    
    <!-- Open Graph & Social -->
    <meta property="og:title" content="PAYKAJASTIP - Jastip, Belanja & Antar Barang Singkawang" />
    <meta property="og:description" content="Layanan jasa titip belanja, belanja pasar, kuliner khas Singkawang, dan pengantaran kilat kurir terpercaya di Singkawang." />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Ignore transient network drops and HMR WebSocket errors in development iframe -->
    <script>
      window.addEventListener('unhandledrejection', function(event) {
        var reason = String(event.reason || '');
        if (reason.includes('WebSocket') || reason.includes('vite') || reason.includes('Failed to fetch')) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = String(event.message || '');
        if (msg.includes('WebSocket') || msg.includes('vite') || msg.includes('Failed to fetch')) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
