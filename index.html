<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PAYKAJASTIP - Jastip, Belanja & Antar Barang Singkawang</title>
    <meta name="description" content="Aplikasi Progressive Web App (PWA) layanan jasa titip belanja, titip beli makanan dan oleh-oleh, serta pengantaran barang kilat kurir di Singkawang, Kalimantan Barat." />
    
    <!-- Open Graph & Social -->
    <meta property="og:title" content="PAYKAJASTIP - Jastip, Belanja & Antar Barang Singkawang" />
    <meta property="og:description" content="Layanan jasa titip belanja, belanja pasar, kuliner khas Singkawang, dan pengantaran kilat kurir terpercaya di Singkawang." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PAYKAJASTIP" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- Graceful handling of Vite development HMR in iframe preview -->
    <script>
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = (reason && reason.message) ? String(reason.message) : String(reason || '');
        if (msg.includes('WebSocket closed without opened') || (msg.includes('WebSocket') && msg.includes('vite'))) {
          console.warn('[Vite HMR Preview] Saluran HMR WebSocket tidak aktif pada proxy iframe ini. Aplikasi berjalan normal.');
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root">
      <!-- Fallback loader to prevent blank screen before JavaScript bundle executes -->
      <div id="initial-loader" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;color:#1e293b;background-color:#f8fafc;padding:20px;text-align:center;">
        <div style="width:48px;height:48px;border:4px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px;"></div>
        <div style="font-weight:700;font-size:16px;color:#1e3a8a;margin-bottom:4px;">PAYKAJASTIP SINGKAWANG</div>
        <div style="font-size:13px;color:#64748b;">Memuat layanan jastip & kurir...</div>
        <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
